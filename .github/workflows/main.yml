name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # para pwede mo ring i-trigger manually sa GitHub Actions tab

      - uses: android-actions/setup-android@v3
      - name: Install NDK & CMake
        run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v3
      
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceRobot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
